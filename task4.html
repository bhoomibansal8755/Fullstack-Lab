<html>
<head>
    <title>Space Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    body {
        margin: 0;
        background: #10051f;
        color: white;
        font-family: Arial, sans-serif;
    }

    /* Navigation */
    .navbar {
        background: #1b0b30;
        padding: 15px;
        border-bottom: 2px solid #b84dff;
    }

    .navbar-brand {
        color: #ff8cdb;
        font-weight: bold;
    }

    .nav-link {
        color: white;
        margin-left: 15px;
        transition: 0.4s;
    }

    .nav-link:hover {
        color: #ff8cdb;
        transform: scale(1.15);
    }

    .home {
        padding: 70px 20px;
        min-height: 400px;
        background: linear-gradient(135deg, #10051f, #40105c, #101d4a);
        overflow: hidden;
    }

    .home h1 {
        font-size: 42px;
        color: #ff8cdb;
        text-shadow: 0 0 15px #b84dff;
    }

    .home p {
        color: #d9c8ff;
        font-size: 18px;
        margin: 20px;
    }


    .rocket {
        font-size: 60px;
        margin: 25px;
        animation: rocketMove 3s infinite ease-in-out;
    }

    @keyframes rocketMove {
        0% {
            transform: translateY(0) rotate(-10deg);
        }

        50% {
            transform: translateY(-30px) rotate(10deg);
        }

        100% {
            transform: translateY(0) rotate(-10deg);
        }
    }


    .astronaut {
        font-size: 40px;
        margin: 20px;
        animation: astronautMove 4s infinite;
    }

    @keyframes astronautMove {
        0% {
            transform: translateX(-20px) rotate(-10deg);
        }

        50% {
            transform: translateX(20px) rotate(10deg);
        }

        100% {
            transform: translateX(-20px) rotate(-10deg);
        }
    }

    .btn {
        background: transparent;
        border: 2px solid #ff8cdb;
        border-radius: 25px;
        padding: 12px 25px;
        transition: 0.4s;
    }

    .btn:hover {
        background: #ff8cdb;
        color: #10051f;
        box-shadow: 0 0 20px #ff8cdb;
        transform: translateY(-5px);
    }

    #about {
        background: #160a2b;
        border-radius: 20px;
        margin-top: 30px;
        margin-bottom: 30px;
        box-shadow: 0 0 15px #40105c;
    }

    #about h2 {
        color: #ff8cdb;
    }


    footer {
        background: #1b0b30;
        color: #d9c8ff;
        border-top: 2px solid #b84dff;
    }

    @media (max-width: 600px) {
        .home h1 {
            font-size: 28px;
        }

        .home {
            padding: 50px 15px;
        }

        .navbar-brand {
            font-size: 18px;
        }

        .nav-link {
            margin-left: 5px;
        }
    }
    </style>
</head>
<body>

  
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Space Explorer</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#home">Home</a>
                <a class="nav-link" href="#about">About</a>
                <a class="nav-link" href="#contact">Contact</a>
            </div>
        </div>
    </nav>

   
    <section class="home text-center" id="home">
        <h1>Welcome to Space 🚀</h1>
        <p>Explore the universe with us!</p>

        <div class="rocket">🚀</div>
        <div class="astronaut">👨‍🚀</div>

        <button class="btn btn-primary">Explore More</button>
    </section>

  
    <section class="container text-center p-5" id="about">
        <h2>About Space</h2>
        <p>Discover planets, stars and amazing things about space.</p>
    </section>

    <footer class="text-center p-3" id="contact">
        <p>Made with ❤️ by Me</p>
    </footer>

</body>
</html>
