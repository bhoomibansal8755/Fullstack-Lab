<html>
<head>
    <title>Diwali Image Gallery</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: #fff3e0;
        }

        h1 {
            color: darkorange;
        }

        #mainImage {
            width: 400px;
            height: 250px;
            border: 4px solid orange;
            border-radius: 10px;
            object-fit: cover;
        }

        .thumbnails img {
            width: 100px;
            height: 70px;
            margin: 10px;
            cursor: pointer;
            border: 2px solid orange;
            border-radius: 8px;
        }

        .thumbnails img:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h1>🪔 Happy Diwali 🪔</h1>


    <!-- Main Image -->
    <img id="mainImage"
    src="https://images.unsplash.com/photo-1608865413696-fb1e4220173f?auto=format&fit=crop&w=800">

    <br><br>

    <div class="thumbnails">

        <img src="https://images.unsplash.com/photo-1608865413696-fb1e4220173f?auto=format&fit=crop&w=800"
        onclick="changeImage(this)">

        <img src="https://images.unsplash.com/photo-1635186769388-b537282188b0?auto=format&fit=crop&w=800"
        onclick="changeImage(this)">

        <img src="https://images.unsplash.com/photo-1605292356183-a77d0a9c9d1d?auto=format&fit=crop&w=800"
        onclick="changeImage(this)">

    </div>

    <script>

        function changeImage(img) {

            document.getElementById("mainImage").src = img.src;

        }

    </script>

</body>
</html>
