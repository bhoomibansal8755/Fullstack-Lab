
<html>
<head>
    <title>Task 7 - DOM Manipulation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: lightblue;
        }

        .container {
            background: white;
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 60%;
        }

        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            margin: 10px;
            text-align: left;
        }

        .delete {
            background: red;
            margin-left: 10px;
        }

        .main-image {
            width: 300px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="container">

        <h2>My-To-Do List</h2>

        <input type="text" id="taskInput" placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>

    </div>
    <script>
        function addTask() {

            let input = document.getElementById("taskInput");

            let task = input.value;

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.innerHTML = task;

            
            let btn = document.createElement("button");

            btn.innerHTML = "Delete";

            btn.className = "delete";

            btn.onclick = function() {
                li.remove();
            };

            li.appendChild(btn);

            document.getElementById("taskList").appendChild(li);

            input.value = "";

        }

    </script>

</body>
</html>
