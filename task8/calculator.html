<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            background-color: white;
            font-family: Arial;
        }

        table {
            background-color: lightgray;
            border: 5px solid gray;
            border-radius: 15px;
            padding: 10px;
            margin: auto;
            width: 400px;
        }

        td {
            padding: 5px;
        }

        input {
            width: 95%;
            height: 100px;
            font-size: 30px;
            text-align: right;
        }

        button {
            width: 100%;
            height: 65px;
            font-size: 20px;
            cursor: pointer;
        }

        .clear {
            background-color: lightcoral;
        }

        .delete {
            background-color: #aaaaff;
        }
    </style>
</head>

<body>

<table>

    <tr>
        <td colspan="4">
            <input type="text" id="display" value="0" readonly>
        </td>
    </tr>

    <tr>
        <td colspan="2">
            <button class="clear" onclick="clearDisplay()">CLEAR</button>
        </td>

        <td colspan="2">
            <button class="delete" onclick="deleteLast()">DELETE</button>
        </td>
    </tr>

    <tr>
        <td><button onclick="press('7')">7</button></td>
        <td><button onclick="press('8')">8</button></td>
        <td><button onclick="press('9')">9</button></td>
        <td><button onclick="press('/')">/</button></td>
    </tr>

    <tr>
        <td><button onclick="press('4')">4</button></td>
        <td><button onclick="press('5')">5</button></td>
        <td><button onclick="press('6')">6</button></td>
        <td><button onclick="press('*')">*</button></td>
    </tr>

    <tr>
        <td><button onclick="press('1')">1</button></td>
        <td><button onclick="press('2')">2</button></td>
        <td><button onclick="press('3')">3</button></td>
        <td><button onclick="press('-')">-</button></td>
    </tr>

    <tr>
        <td><button onclick="press('.')">.</button></td>
        <td><button onclick="press('0')">0</button></td>
        <td><button onclick="calculate()">=</button></td>
        <td><button onclick="press('+')">+</button></td>
    </tr>

</table>

<script>

let display = document.getElementById("display");

function press(value) {

    if (display.value === "Error") {
        display.value = "0";
    }

    if (display.value === "0") {
        display.value = value;
    }
    else {
        display.value += value;
    }
}

function clearDisplay() {
    display.value = "0";
}

function deleteLast() {

    display.value = display.value.slice(0, -1);

    if (display.value === "") {
        display.value = "0";
    }
}

function calculate() {

    try {
        let result = eval(display.value);

        if (!Number.isFinite(result)) {
            throw new Error("Invalid");
        }

        display.value = result;
    }
    catch {
        display.value = "Error";
    }
}

</script>

</body>
</html>
