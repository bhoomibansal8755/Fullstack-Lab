<!DOCTYPE html>
<html>
<head>
    <title>Task 9 - API Fetching</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            text-align: center;
            margin: 0;
            padding: 50px;
        }

        .container {
            background-color: white;
            width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #764ba2;
        }

        #result {
            background-color: #f3f0ff;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            color: #333;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .loading {
            color: #764ba2;
            font-weight: bold;
            text-align: center;
        }

        .title {
            color: #667eea;
            font-size: 20px;
        }

        .footer {
            margin-top: 20px;
            color: gray;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>🌐 API Data Fetching</h2>

        <p>Asynchronous Programming using JavaScript</p>

        <button onclick="fetchData()">Fetch API Data</button>

        <div id="result">
            Click the button to fetch data.
        </div>

        <div class="footer">
            Task 9 | JavaScript Promises & setTimeout()
        </div>

    </div>

    <script>

        function fetchData() {

            document.getElementById("result").innerHTML =
                "<p class='loading'>⏳ Loading data...</p>";

            setTimeout(function() {

                fetch("https://jsonplaceholder.typicode.com/posts/1")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("API Error");
                    }

                    return response.json();

                })

                .then(data => {

                    document.getElementById("result").innerHTML =

                    "<h3 class='title'>API Data Received Successfully!</h3>" +

                    "<p><b>ID:</b> " + data.id + "</p>" +

                    "<p><b>User ID:</b> " + data.userId + "</p>" +

                    "<p><b>Title:</b> " + data.title + "</p>" +

                    "<p><b>Body:</b> " + data.body + "</p>";

                })

                .catch(error => {

                    document.getElementById("result").innerHTML =
                    "<p style='color:red;'>Error fetching data!</p>";

                });

            }, 3000);

        }

    </script>

</body>
</html>
