<!DOCTYPE html>
<html>
<head>
  <title>Age Eligibility Checker</title>
</head>
<body>
  <script>
    const input = prompt("Enter your age:");
    const age = Number(input);

    if (input === null || input.trim() === "" || !Number.isFinite(age) || age < 0) {
      alert("Please enter a valid age.");
      document.write("A valid age was not entered.");
    } else {
      const message = age >= 18
        ? "You are eligible."
        : "You are not eligible yet.";

      alert(message);

      if (age >= 18) {
        document.write("Age: " + age + "<br>You are eligible.");
      } else {
        document.write("Age: " + age + "<br>You are not eligible yet.");
      }
    }
  </script>
</body>
</html>
